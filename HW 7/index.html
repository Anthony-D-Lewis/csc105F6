<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="task-entry">
        <input id="task-input" type="text" placeholder="Enter a task" autocomplete="off">
        <button id="add-task-button" type="submit">Add Task</button>
      </div>
    </form>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
